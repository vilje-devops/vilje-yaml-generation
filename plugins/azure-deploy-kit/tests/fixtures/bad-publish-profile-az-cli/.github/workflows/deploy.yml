name: Deploy with slot swap
on:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: deploy-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/webapps-deploy@v2
        with:
          app-name: "vilje-api-prod"
          slot-name: "staging"
          publish-profile: "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}"
          package: .
      - name: Swap slot
        run: az webapp deployment slot swap --name vilje-api-prod --slot staging
